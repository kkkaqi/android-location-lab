pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google(); mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = 'WechatContainerLab'
include ':app', ':Bcore', ':black-reflection', ':compiler'
project(':Bcore').projectDir = file('vendor/blackbox/Bcore')
project(':black-reflection').projectDir = file('vendor/blackbox/black-reflection')
project(':compiler').projectDir = file('vendor/blackbox/compiler')
